name: Macsteam
options:
  bundleIdPrefix: com.macsteam
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  MacsteamApp:
    type: application
    platform: macOS
    productName: Macsteam
    scheme:
      testTargets: []
      gatherCoverageData: false
    sources:
      - path: macsteam-app/Sources/MacsteamApp
    dependencies:
      - target: macsteam-dylib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macsteam.app
        PRODUCT_NAME: Macsteam
        PRODUCT_MODULE_NAME: MacsteamApp
        EXECUTABLE_NAME: MacsteamApp
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSMinimumSystemVersion: "13.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    postCompileScripts:
      - name: "Embed macsteam.dylib"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/out/macsteam.dylib"
          DEST_DIR="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources"
          if [ ! -f "$SRC" ]; then
            echo "error: $SRC missing (macsteam-dylib target should have built it)" >&2
            exit 1
          fi
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST_DIR/macsteam.dylib"
          echo "embedded $SRC -> $DEST_DIR/macsteam.dylib"

  macsteam-dylib:
    type: ""
    platform: macOS
    sources:
      - path: src
        buildPhase: none
      - path: scripts
        buildPhase: none
      - path: tests
        buildPhase: none
      - path: Makefile
        buildPhase: none
    legacy:
      toolPath: /usr/bin/env
      arguments: "-i PATH=/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin HOME=$HOME /bin/sh $SRCROOT/scripts/build.sh"
      workingDirectory: "$SRCROOT"
      passSettings: false

  macsteam-launcher:
    type: ""
    platform: macOS
    sources:
      - path: launcher
        buildPhase: none
    legacy:
      toolPath: /usr/bin/env
      arguments: "-i PATH=/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin HOME=$HOME /usr/bin/make -C $SRCROOT/launcher app"
      workingDirectory: "$SRCROOT/launcher"
      passSettings: false

schemes:
  macSteam All:
    build:
      targets:
        macsteam-dylib: all
        macsteam-launcher: all
        MacsteamApp: all
